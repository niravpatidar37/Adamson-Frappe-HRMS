[project]
name = "adamson-frappe-hrms"
version = "0.1.0"
description = "Decoupled hybrid: Frappe HR as system of record, private AI screening engine"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8.3", "ruff>=0.7", "mypy>=1.13"]

[tool.ruff]
line-length = 100
target-version = "py310"
exclude = ["deploy", "apps/*/adamson_screening_bridge/fixtures"]

[tool.ruff.lint]
ignore = ["B008"]

[tool.ruff.lint.isort]
known-first-party = ["screening", "app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# The domain package is importable without installing the engine, so the unit
# tests run in under a second with no database and no web server.
pythonpath = ["services/screening_engine"]
