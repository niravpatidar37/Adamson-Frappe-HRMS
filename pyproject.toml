[project]
name = "adamson-screening"
version = "0.1.0"
description = "Framework-independent resume screening core for the Frappe HR custom app"
requires-python = ">=3.10"
dependencies = [
    "pydantic>=2.9",
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = ["pytest>=8.3", "ruff>=0.7"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
